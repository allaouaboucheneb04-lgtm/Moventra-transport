<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendrier | Moventra</title><link rel="icon" href="logo.jpeg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-nav.css?v=crm-real-2"></head><body class="adminBody"><main class="adminMain"><section class="crmHero"><span class="crmBadge">PLANNING CENTRAL</span><h1>📅 Calendrier</h1><p>Soumissions planifiées, travaux assignés et échéances de factures au même endroit.</p></section><section class="crmStats"><div class="crmStat"><b id="monthEvents">0</b><span>ÉVÉNEMENTS CE MOIS</span></div><div class="crmStat"><b id="monthSubs">0</b><span>SOUMISSIONS</span></div><div class="crmStat"><b id="monthTasks">0</b><span>TRAVAUX</span></div><div class="crmStat"><b id="monthInvoices">0</b><span>ÉCHÉANCES</span></div></section><section class="crmPanel"><div class="calControls"><button id="prev">← Mois précédent</button><h2 id="month"></h2><button id="today">Aujourd’hui</button><button id="next">Mois suivant →</button></div><div class="calendarLegend"><span>📋 Soumission</span><span>👷 Travail</span><span>🧾 Facture</span></div><div id="calendar" class="calendarGrid"></div><h3 style="margin-top:25px">Agenda du mois</h3><div id="agenda" class="agendaList"></div></section></main>
<script type="module">
import{auth,db}from'./firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';let cursor=new Date(),events=[];const $=id=>document.getElementById(id),cal=$('calendar'),title=$('month'),agenda=$('agenda');const val=(o,...ks)=>{for(const k of ks)if(o?.[k])return o[k];return''};const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function parseDate(v){if(!v)return null;if(v?.toDate)return v.toDate();const d=new Date(v);return isNaN(d)?null:d}const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function draw(){const y=cursor.getFullYear(),m=cursor.getMonth(),monthEvents=events.filter(e=>e.date.getFullYear()===y&&e.date.getMonth()===m);title.textContent=new Intl.DateTimeFormat('fr-CA',{month:'long',year:'numeric'}).format(cursor);$('monthEvents').textContent=monthEvents.length;$('monthSubs').textContent=monthEvents.filter(e=>e.kind==='submission').length;$('monthTasks').textContent=monthEvents.filter(e=>e.kind==='task').length;$('monthInvoices').textContent=monthEvents.filter(e=>e.kind==='invoice').length;const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),todayKey=key(new Date());let html=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="calendarHead">${x}</div>`).join('');for(let i=0;i<42;i++){let day=i-start+1,dm=m,dy=y,muted=false;if(day<1){day=prevDays+day;dm=m-1;muted=true}if(day>days){day-=days;dm=m+1;muted=true}const dt=new Date(dy,dm,day),dk=key(dt),es=events.filter(e=>key(e.date)===dk);html+=`<div class="calendarDay${muted?' muted':''}${dk===todayKey?' today':''}"><div class="calendarDate">${day}</div>${es.slice(0,4).map(e=>`<a href="${e.href}" class="calEvent ${e.kind==='task'?'task':e.kind==='invoice'?'invoice':''}">${esc(e.icon+' '+e.label)}</a>`).join('')}${es.length>4?`<div class="calEvent">+${es.length-4} autres</div>`:''}</div>`}cal.innerHTML=html;agenda.innerHTML=monthEvents.length?monthEvents.sort((a,b)=>a.date-b.date).map(e=>`<div class="agendaItem"><b>${new Intl.DateTimeFormat('fr-CA',{day:'2-digit',month:'short'}).format(e.date)}</b><div><strong>${esc(e.icon+' '+e.label)}</strong><div class="historyMeta">${esc(e.detail||'')}</div></div><a class="smallBtn" href="${e.href}">Ouvrir</a></div>`).join(''):'<div class="emptyState">Aucun événement pour ce mois.</div>'}
$('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);draw()};$('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);draw()};$('today').onclick=()=>{cursor=new Date();draw()};
onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}try{const [q,t,f]=await Promise.all([getDocs(collection(db,'demandes_soumission')),getDocs(collection(db,'taches')),getDocs(collection(db,'factures'))]);q.forEach(d=>{const o=d.data(),date=parseDate(val(o,'date','dateSouhaitee','dateDemenagement'));if(date)events.push({date,kind:'submission',icon:'📋',label:(val(o,'nom','name')||'Client')+' — '+(val(o,'service','typeService')||'Soumission'),detail:(val(o,'adresseDepart','depart')||'')+' → '+(val(o,'destination','adresseArrivee')||''),href:'admin.html#soumissions'})});t.forEach(d=>{const o=d.data(),date=parseDate(val(o,'date','dateTravail','scheduledDate'));if(date)events.push({date,kind:'task',icon:'👷',label:(val(o,'clientNom','nom')||'Travail')+' — '+(val(o,'service','typeService')||''),detail:val(o,'employeeName','employeNom','adresse'),href:'dispatch.html'})});f.forEach(d=>{const o=d.data(),date=parseDate(val(o,'dateEcheance','echeance'));if(date)events.push({date,kind:'invoice',icon:'🧾',label:val(o,'numero','numeroFacture')||'Facture',detail:(val(o,'clientNom','nom')||'Client')+' — '+Number(o.total||o.totalTTC||0).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}),href:'facturation.html'})});draw()}catch(e){cal.innerHTML=`<div class="emptyState">Erreur : ${esc(e.message)}</div>`}});
</script><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="push.js?v=subscription-fix-1" defer></script>
<script src="admin-nav.js?v=subscription-fix-1"></script></body></html>
