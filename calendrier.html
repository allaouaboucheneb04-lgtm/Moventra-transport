<style>

.calPanel{padding:26px}.calToolbar{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}.calNav,.calViews{display:flex;gap:12px}.calBtn,.calSelect{min-height:52px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 18px;font:800 16px/1.1 inherit;color:#16304f;cursor:pointer}.calBtn{display:inline-flex;align-items:center;justify-content:center}.calBtn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.calTitle{text-align:center;margin:0;color:#0c294c;font-size:25px;text-transform:capitalize}.calFilters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.calendarLegend{display:flex;gap:22px;flex-wrap:wrap;margin:20px 0;padding:0 4px;font-weight:800;color:#17324f}.calendarLegend span{display:flex;align-items:center;gap:8px}.legendDot{width:14px;height:14px;border-radius:50%}.submissionDot{background:#2388dc}.confirmedDot{background:#27823a}.taskDot{background:#952bb5}.invoiceDot{background:#ef6c00}.cancelledDot{background:#cf2b2b}.calendarFrame{border-top:4px solid #dbe7f3;padding-top:20px}.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.calendarHead{padding:13px 6px;text-align:center;font-weight:900;color:#17324f;background:#f0f5fb;border-right:1px solid var(--line)}.calendarDay{min-height:124px;padding:8px;border-top:1px solid var(--line);border-right:1px solid var(--line);background:#fff}.calendarDay.muted{background:#f9fbfd;color:#9aabc0}.calendarDay.today{box-shadow:inset 0 0 0 3px var(--blue)}.calendarDate{font-weight:900;margin-bottom:7px}.calEvent{display:block;width:100%;border:0;text-align:left;border-radius:8px;padding:7px;margin:5px 0;font:800 12px/1.25 inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:#e4f2ff;color:#075798}.calEvent.confirmed{background:#e7f5e9;color:#1d6629}.calEvent.task{background:#f3e6f8;color:#72208a}.calEvent.invoice{background:#fff0df;color:#a64b00}.calEvent.cancelled{background:#ffe8e8;color:#a51212}.weekGrid{display:grid;grid-template-columns:72px repeat(7,minmax(130px,1fr));overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.weekCell,.weekHead{min-height:62px;padding:8px;border-right:1px solid var(--line);border-top:1px solid var(--line)}.weekHead{background:#f0f5fb;font-weight:900;text-align:center;position:sticky;top:0}.weekTime{font-size:12px;color:var(--muted);background:#fafcff}.dayList,.agendaList{display:grid;gap:12px}.dayCard,.agendaItem{border:1px solid var(--line);border-left:6px solid #2388dc;background:#fff;border-radius:14px;padding:15px}.dayCard.confirmed,.agendaItem.confirmed{border-left-color:#27823a}.dayCard.task,.agendaItem.task{border-left-color:#952bb5}.dayCard.invoice,.agendaItem.invoice{border-left-color:#ef6c00}.dayCard.cancelled,.agendaItem.cancelled{border-left-color:#cf2b2b}.agendaItem{display:grid;grid-template-columns:125px 1fr auto;gap:14px;align-items:center}.agendaTime{font-weight:900;color:#0b62c5}.agendaMeta{font-size:14px;color:#6d8199;margin-top:4px}.emptyState{padding:36px;text-align:center;color:#7185a0;font-weight:700}.hidden{display:none!important}
.detailModal{position:fixed;inset:0;background:rgba(7,25,48,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:10000}.detailModal.open{display:flex}.detailBox{background:#fff;border-radius:20px;max-width:690px;width:100%;max-height:88vh;overflow:auto;padding:24px}.detailHeader{display:flex;justify-content:space-between;gap:12px}.closeModal{border:0;background:#edf3fa;border-radius:50%;width:42px;height:42px;font-size:24px}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.detailField{background:#f5f8fc;border-radius:12px;padding:12px}.detailField span,.editField label{display:block;font-size:12px;color:#7185a0;font-weight:900;text-transform:uppercase}.detailField b{display:block;margin-top:5px}.editSection{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editField input,.editField select{width:100%;box-sizing:border-box;border:1px solid #cbd9e8;border-radius:10px;padding:11px;margin-top:5px;font:700 15px inherit}.modalActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.statusLine{min-height:20px;margin-top:10px;font-weight:800}.smallBtn{border:0;border-radius:10px;background:#1267d5;color:#fff!important;text-decoration:none;padding:11px 15px;font-weight:800;cursor:pointer}.smallBtn.secondary{background:#edf3fa;color:#17324f!important}.smallBtn.green{background:#27823a}
@media(max-width:800px){.calPanel{padding:20px}.calToolbar{grid-template-columns:1fr}.calNav,.calViews{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.calTitle{order:-1;font-size:22px}.calFilters{grid-template-columns:1fr 1fr}.calFilters .calSelect:last-child{grid-column:1/-1}.calendarGrid{grid-template-columns:repeat(7,minmax(105px,1fr));overflow:auto}.calendarDay{min-height:108px}.agendaItem{grid-template-columns:1fr}.detailGrid,.editGrid{grid-template-columns:1fr}.crmHero{margin-top:0}.calBtn,.calSelect{font-size:15px;padding:10px 8px}}

<body class="adminBody">
<main class="adminMain">
<section class="crmHero"><span class="crmBadge">PLANNING CENTRAL</span><h1>Calendrier</h1><p>Soumissions confirmées, missions, employés, camions et échéances au même endroit.</p></section>
<section class="crmStats"><div class="crmStat"><b id="monthEvents">0</b><span>ÉVÉNEMENTS</span></div><div class="crmStat"><b id="monthSubs">0</b><span>SOUMISSIONS</span></div><div class="crmStat"><b id="monthTasks">0</b><span>MISSIONS</span></div><div class="crmStat"><b id="monthInvoices">0</b><span>ÉCHÉANCES</span></div></section>
<section class="crmPanel calPanel">
<div class="calToolbar"><div class="calNav"><button id="prev" class="calBtn" aria-label="Précédent">←</button><button id="today" class="calBtn">Aujourd’hui</button><button id="next" class="calBtn" aria-label="Suivant">→</button></div><h2 id="periodTitle" class="calTitle"></h2><div class="calViews"><button class="calBtn viewBtn active" data-view="month">Mois</button><button class="calBtn viewBtn" data-view="week">Semaine</button><button class="calBtn viewBtn" data-view="day">Jour</button></div></div>
<div class="calFilters"><select id="typeFilter" class="calSelect"><option value="all">Tous les types</option><option value="submission">Soumissions</option><option value="confirmed">Confirmés</option><option value="task">Missions</option><option value="invoice">Factures</option><option value="cancelled">Annulés</option></select><select id="employeeFilter" class="calSelect"><option value="all">Tous les employés</option></select><select id="truckFilter" class="calSelect"><option value="all">Tous les camions</option></select></div>
<div class="calendarLegend"><span><i class="legendDot submissionDot"></i>Soumission</span><span><i class="legendDot confirmedDot"></i>Confirmé</span><span><i class="legendDot taskDot"></i>Mission</span><span><i class="legendDot invoiceDot"></i>Facture</span><span><i class="legendDot cancelledDot"></i>Annulé</span></div>
<div class="calendarFrame"><div id="loading" class="emptyState">Chargement du calendrier…</div><div id="monthView" class="calendarGrid hidden"></div><div id="weekView" class="weekGrid hidden"></div><div id="dayView" class="dayList hidden"></div></div>
<h3 style="margin-top:28px">Agenda</h3><div id="agenda" class="agendaList"></div>
</section></main>
<div id="detailModal" class="detailModal"><div class="detailBox"><div class="detailHeader"><div><span id="modalType" class="crmBadge"></span><h2 id="modalTitle"></h2></div><button id="closeModal" class="closeModal">×</button></div><div id="modalDetails" class="detailGrid"></div><div class="editSection"><h3>Modifier la planification</h3><div class="editGrid"><div class="editField"><label>Date</label><input id="editDate" type="date"></div><div class="editField"><label>Heure</label><input id="editTime" type="time"></div><div class="editField"><label>Employé</label><select id="editEmployee"><option value="">Non assigné</option></select></div><div class="editField"><label>Camion</label><input id="editTruck" list="truckOptions" placeholder="Ex. Camion 1"><datalist id="truckOptions"></datalist></div><div class="editField"><label>Statut</label><select id="editStatus"></select></div></div><div id="saveStatus" class="statusLine"></div></div><div class="modalActions"><button id="saveEvent" class="smallBtn green">Enregistrer</button><a id="modalOpen" class="smallBtn" href="#">Ouvrir la fiche</a><a class="smallBtn secondary" href="dispatch.html">Voir le dispatch</a></div></div></div>
<script type="module">
import{auth,db,ROLES_COLLECTION,QUOTES_COLLECTION,TASKS_COLLECTION}from'./firebase-config.js';
import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import{collection,onSnapshot,doc,updateDoc,serverTimestamp,getDocs}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(o,...keys)=>{for(const k of keys){const v=o?.[k];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v}return''};
const parseDate=v=>{if(!v)return null;if(v?.toDate)return v.toDate();if(v?.seconds)return new Date(v.seconds*1000);if(/^\d{4}-\d{2}-\d{2}$/.test(String(v)))return new Date(String(v)+'T12:00:00');const d=new Date(v);return isNaN(d)?null:d};
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dateInput=d=>d?key(d):'';const startWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
let cursor=new Date(),view='month',events=[],activeEvent=null,employees=[],trucks=[],loaded={q:false,t:false,f:false};
let source={q:[],t:[],f:[]};
const normalize=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function statusKind(s){const x=normalize(s);if(x.includes('annul')||x.includes('refus')||x.includes('archive'))return'cancelled';if(x.includes('accept')||x.includes('confirm')||x.includes('assign'))return'confirmed';return'submission'}
function makeSubmission(d){const o=d.data(),status=val(o,'status','statut'),kind=statusKind(status);const dv=kind==='confirmed'?val(o,'confirmedDate','dateConfirmee','date','dateSouhaitee'):val(o,'date','dateSouhaitee','desiredDate');const date=parseDate(dv);if(!date)return null;const time=val(o,'confirmedTime','time','heure','heureDemenagement');return{id:d.id,collection:QUOTES_COLLECTION,raw:o,date,time:String(time||''),kind,label:`${val(o,'name','nom')||'Client'} — ${val(o,'service','typeService')||'Soumission'}`,client:val(o,'name','nom'),phone:val(o,'phone','telephone'),depart:val(o,'address','depart','adresseDepart'),arrival:val(o,'destination','arrivalAddress','adresseArrivee'),employee:val(o,'assignedToName','employeeName','employeNom'),truck:val(o,'truck','camion','vehicule'),status:String(status||'nouvelle'),detail:`${val(o,'address','depart')||'Départ à confirmer'} → ${val(o,'destination','arrivalAddress','adresseArrivee')||'Arrivée à confirmer'}`,href:`soumissions.html?open=${d.id}`}}
function makeTask(d){const o=d.data(),date=parseDate(val(o,'date','dateTravail','scheduledDate'));if(!date)return null;return{id:d.id,collection:TASKS_COLLECTION,raw:o,date,time:String(val(o,'time','heureDebut','heure','startTime')||''),kind:normalize(val(o,'status','statut')).includes('annul')?'cancelled':'task',label:`${val(o,'clientName','name','nom')||'Mission'} — ${val(o,'service','typeService')||''}`,client:val(o,'clientName','name','nom'),phone:val(o,'phone','telephone'),depart:val(o,'address','depart','adresseDepart'),arrival:val(o,'destination','adresseArrivee'),employee:val(o,'employeeName','employeNom'),employeeId:val(o,'employeeId','assignedTo'),truck:val(o,'truck','camion','vehicule'),status:String(val(o,'status','statut')||'assigné'),detail:[val(o,'employeeName','employeNom'),val(o,'truck','camion','vehicule')].filter(Boolean).join(' • ')||'Mission à planifier',href:`dispatch.html?taskId=${d.id}`}}
function makeInvoice(d){const o=d.data(),date=parseDate(val(o,'echeance','dateEcheance','dueDate','date'));if(!date)return null;return{id:d.id,collection:'factures',raw:o,date,time:'09:00',kind:normalize(val(o,'statut','status')).includes('annul')?'cancelled':'invoice',label:`${val(o,'numero','numeroFacture')||'Facture'} — ${val(o,'clientNom','nom')||'Client'}`,client:val(o,'clientNom','nom'),phone:val(o,'clientPhone','telephone'),status:String(val(o,'statut','status')||'brouillon'),detail:Number(val(o,'total','totalTTC')||0).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}),href:`facturation.html?factureId=${d.id}`}}
function rebuild(){events=[...source.q.map(makeSubmission),...source.t.map(makeTask),...source.f.map(makeInvoice)].filter(Boolean);trucks=[...new Set(events.map(e=>e.truck).filter(Boolean))].sort();refreshOptions();draw()}
function refreshOptions(){const currentE=$('employeeFilter').value,currentT=$('truckFilter').value;$('employeeFilter').innerHTML='<option value="all">Tous les employés</option>'+employees.map(e=>`<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('');$('truckFilter').innerHTML='<option value="all">Tous les camions</option>'+trucks.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if([...$('employeeFilter').options].some(o=>o.value===currentE))$('employeeFilter').value=currentE;if([...$('truckFilter').options].some(o=>o.value===currentT))$('truckFilter').value=currentT;$('editEmployee').innerHTML='<option value="">Non assigné</option>'+employees.map(e=>`<option value="${esc(e.id)}">${esc(e.name)}</option>`).join('');$('truckOptions').innerHTML=trucks.map(x=>`<option value="${esc(x)}"></option>`).join('')}
function filtered(){const t=$('typeFilter').value,e=$('employeeFilter').value,tr=$('truckFilter').value;return events.filter(x=>(t==='all'||x.kind===t)&&(e==='all'||x.employee===e)&&(tr==='all'||x.truck===tr))}
const cls=e=>e.kind==='confirmed'?'confirmed':e.kind==='task'?'task':e.kind==='invoice'?'invoice':e.kind==='cancelled'?'cancelled':'';
const niceDate=d=>new Intl.DateTimeFormat('fr-CA',{weekday:'short',day:'2-digit',month:'short'}).format(d);const niceTime=e=>e.time||'—';
function openEvent(e){activeEvent=e;$('modalType').textContent={submission:'Soumission',confirmed:'Confirmé',task:'Mission',invoice:'Facture',cancelled:'Annulé'}[e.kind];$('modalTitle').textContent=e.label;$('modalDetails').innerHTML=[['Date',niceDate(e.date)],['Heure',niceTime(e)],['Client',e.client],['Téléphone',e.phone],['Départ',e.depart],['Arrivée',e.arrival],['Employé',e.employee],['Camion',e.truck],['Statut',e.status],['Détails',e.detail]].filter(x=>x[1]).map(([a,b])=>`<div class="detailField"><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('');$('editDate').value=dateInput(e.date);$('editTime').value=e.time||'';$('editTruck').value=e.truck||'';$('modalOpen').href=e.href;const emp=employees.find(x=>x.id===e.employeeId||x.name===e.employee);$('editEmployee').value=emp?.id||'';const statuses=e.collection==='factures'?['brouillon','envoyée','partiellement payée','payée','annulée']:e.collection===TASKS_COLLECTION?['à planifier','assigné','en cours','terminé','annulé']:['nouvelle','devis_envoye','acceptee','refusee','archivee'];$('editStatus').innerHTML=statuses.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('editStatus').value=statuses.includes(e.status)?e.status:statuses[0];$('saveStatus').textContent='';$('detailModal').classList.add('open')}
window.openCal=id=>{const e=events.find(x=>x.collection+':'+x.id===id);if(e)openEvent(e)};
function eventButton(e){return`<button class="calEvent ${cls(e)}" onclick="openCal('${esc(e.collection+':'+e.id)}')">${esc((e.time?e.time+' ':'')+e.label)}</button>`}
function drawMonth(list){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),today=key(new Date());let h=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="calendarHead">${x}</div>`).join('');for(let i=0;i<42;i++){let n=i-offset+1,mm=m,muted=false;if(n<1){n=prev+n;mm=m-1;muted=true}else if(n>days){n-=days;mm=m+1;muted=true}const d=new Date(y,mm,n),es=list.filter(e=>key(e.date)===key(d));h+=`<div class="calendarDay${muted?' muted':''}${key(d)===today?' today':''}"><div class="calendarDate">${n}</div>${es.slice(0,4).map(eventButton).join('')}${es.length>4?`<div class="agendaMeta">+${es.length-4} autres</div>`:''}</div>`}$('monthView').innerHTML=h}
function drawWeek(list){const s=startWeek(cursor);let h='<div class="weekHead"></div>';for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);h+=`<div class="weekHead">${niceDate(d)}</div>`}for(let hour=7;hour<=21;hour++){h+=`<div class="weekCell weekTime">${String(hour).padStart(2,'0')}:00</div>`;for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);const es=list.filter(e=>key(e.date)===key(d)&&Number((e.time||'09:00').slice(0,2))===hour);h+=`<div class="weekCell">${es.map(eventButton).join('')}</div>`}}$('weekView').innerHTML=h}
function drawDay(list){const es=list.filter(e=>key(e.date)===key(cursor)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('dayView').innerHTML=es.length?es.map(e=>`<article class="dayCard ${cls(e)}"><b class="agendaTime">${esc(niceTime(e))}</b><h3>${esc(e.label)}</h3><div class="agendaMeta">${esc(e.detail)}</div><button class="smallBtn" onclick="openCal('${esc(e.collection+':'+e.id)}')">Détails</button></article>`).join(''):'<div class="emptyState">Aucun événement ce jour.</div>'}
function rangeFor(list){if(view==='month')return list.filter(e=>e.date.getFullYear()===cursor.getFullYear()&&e.date.getMonth()===cursor.getMonth());if(view==='week'){const s=startWeek(cursor),end=new Date(s);end.setDate(s.getDate()+7);return list.filter(e=>e.date>=s&&e.date<end)}return list.filter(e=>key(e.date)===key(cursor))}
function draw(){if(!Object.values(loaded).every(Boolean))return;$('loading').classList.add('hidden');const list=filtered(),range=rangeFor(list);document.querySelectorAll('.viewBtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('monthView').classList.toggle('hidden',view!=='month');$('weekView').classList.toggle('hidden',view!=='week');$('dayView').classList.toggle('hidden',view!=='day');if(view==='month')$('periodTitle').textContent=new Intl.DateTimeFormat('fr-CA',{month:'long',year:'numeric'}).format(cursor);if(view==='week'){const s=startWeek(cursor),e=new Date(s);e.setDate(s.getDate()+6);$('periodTitle').textContent=`${niceDate(s)} – ${niceDate(e)}`}if(view==='day')$('periodTitle').textContent=new Intl.DateTimeFormat('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(cursor);$('monthEvents').textContent=range.length;$('monthSubs').textContent=range.filter(e=>['submission','confirmed'].includes(e.kind)).length;$('monthTasks').textContent=range.filter(e=>e.kind==='task').length;$('monthInvoices').textContent=range.filter(e=>e.kind==='invoice').length;drawMonth(list);drawWeek(list);drawDay(list);const sorted=[...range].sort((a,b)=>a.date-b.date||(a.time||'').localeCompare(b.time||''));$('agenda').innerHTML=sorted.length?sorted.map(e=>`<article class="agendaItem ${cls(e)}"><div class="agendaTime">${esc(niceDate(e.date))}<br>${esc(niceTime(e))}</div><div><strong>${esc(e.label)}</strong><div class="agendaMeta">${esc(e.detail)}</div></div><button class="smallBtn" onclick="openCal('${esc(e.collection+':'+e.id)}')">Détails</button></article>`).join(''):'<div class="emptyState">Aucun événement pour cette période.</div>'}
$('saveEvent').onclick=async()=>{if(!activeEvent)return;const btn=$('saveEvent');btn.disabled=true;$('saveStatus').textContent='Enregistrement…';try{const date=$('editDate').value,time=$('editTime').value,emp=employees.find(x=>x.id===$('editEmployee').value),truck=$('editTruck').value.trim(),status=$('editStatus').value;let data={updatedAt:serverTimestamp()};if(activeEvent.collection===QUOTES_COLLECTION)data={...data,confirmedDate:date,confirmedTime:time,assignedTo:emp?.id||'',assignedToName:emp?.name||'',truck,status};else if(activeEvent.collection===TASKS_COLLECTION)data={...data,date,time,employeeId:emp?.id||'',employeeName:emp?.name||'',truck,status};else data={...data,echeance:date,statut:status};await updateDoc(doc(db,activeEvent.collection,activeEvent.id),data);$('saveStatus').textContent='✅ Planification enregistrée dans Firebase.';setTimeout(()=>$('detailModal').classList.remove('open'),650)}catch(err){console.error(err);$('saveStatus').textContent='❌ '+(err.message||err.code)}finally{btn.disabled=false}};
$('prev').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else cursor.setDate(cursor.getDate()-(view==='week'?7:1));cursor=new Date(cursor);draw()};$('next').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else cursor.setDate(cursor.getDate()+(view==='week'?7:1));cursor=new Date(cursor);draw()};$('today').onclick=()=>{cursor=new Date();draw()};document.querySelectorAll('.viewBtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;draw()});['typeFilter','employeeFilter','truckFilter'].forEach(id=>$(id).onchange=draw);$('closeModal').onclick=()=>$('detailModal').classList.remove('open');$('detailModal').onclick=e=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('open')};
onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html?required=1');return}try{const snap=await getDocs(collection(db,ROLES_COLLECTION));employees=snap.docs.map(d=>({id:d.id,...d.data()})).filter(x=>['employe','employee','admin'].includes(normalize(x.role))).map(x=>({id:x.id,name:val(x,'name','nom','displayName','email')||'Employé'})).sort((a,b)=>a.name.localeCompare(b.name));refreshOptions()}catch(e){console.warn('Employés non chargés',e)}onSnapshot(collection(db,QUOTES_COLLECTION),s=>{source.q=s.docs;loaded.q=true;rebuild()},e=>{$('loading').textContent='Erreur soumissions : '+e.message;loaded.q=true;rebuild()});onSnapshot(collection(db,TASKS_COLLECTION),s=>{source.t=s.docs;loaded.t=true;rebuild()},e=>{$('loading').textContent='Erreur missions : '+e.message;loaded.t=true;rebuild()});onSnapshot(collection(db,'factures'),s=>{source.f=s.docs;loaded.f=true;rebuild()},e=>{$('loading').textContent='Erreur factures : '+e.message;loaded.f=true;rebuild()})});
