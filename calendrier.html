<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendrier | Moventra</title>
<link rel="icon" href="logo.jpeg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="admin-nav.css?v=crm-real-2">
<style>
.calTopbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}.calNav,.calViews,.calFilters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.calBtn,.calSelect{border:1px solid #dbe4f0;background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;color:#17324d;cursor:pointer}.calBtn.active{background:#1565c0;color:#fff;border-color:#1565c0}.calTitle{margin:0;font-size:22px}.calendarLegend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 16px}.legendDot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.dotSubmission{background:#1e88e5}.dotConfirmed{background:#2e7d32}.dotTask{background:#8e24aa}.dotInvoice{background:#ef6c00}.dotCancelled{background:#c62828}.calendarGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid #dbe4f0;border-radius:14px;overflow:hidden;background:#fff}.calendarHead{padding:12px;background:#f4f7fb;font-weight:800;text-align:center;border-right:1px solid #e8eef6}.calendarDay{min-height:122px;padding:8px;border-right:1px solid #e8eef6;border-top:1px solid #e8eef6;background:#fff}.calendarDay.muted{background:#fafbfc;color:#9aa8b6}.calendarDay.today{box-shadow:inset 0 0 0 2px #1565c0}.calendarDate{font-weight:800;margin-bottom:6px}.calEvent{display:block;text-decoration:none;border-radius:8px;padding:6px 7px;margin:4px 0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#e3f2fd;color:#0d47a1}.calEvent.confirmed{background:#e8f5e9;color:#1b5e20}.calEvent.task{background:#f3e5f5;color:#6a1b9a}.calEvent.invoice{background:#fff3e0;color:#e65100}.calEvent.cancelled{background:#ffebee;color:#b71c1c}.agendaList{display:grid;gap:10px}.agendaItem{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;border:1px solid #e3eaf3;background:#fff;border-radius:12px;padding:14px}.agendaTime{font-weight:800;color:#1565c0}.agendaMeta{color:#66788a;font-size:13px;margin-top:4px}.weekGrid{display:grid;grid-template-columns:80px repeat(7,minmax(130px,1fr));overflow:auto;border:1px solid #dbe4f0;border-radius:14px;background:#fff}.weekCell,.weekHead{min-height:54px;padding:8px;border-right:1px solid #e8eef6;border-top:1px solid #e8eef6}.weekHead{background:#f4f7fb;font-weight:800;text-align:center;position:sticky;top:0}.weekTime{font-size:12px;color:#66788a;background:#fafbfc}.dayList{display:grid;gap:12px}.dayCard{border-left:5px solid #1565c0;border-radius:12px;background:#fff;padding:16px;box-shadow:0 4px 16px rgba(20,55,90,.07)}.dayCard.task{border-color:#8e24aa}.dayCard.invoice{border-color:#ef6c00}.dayCard.confirmed{border-color:#2e7d32}.detailModal{position:fixed;inset:0;background:rgba(10,25,45,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:9999}.detailModal.open{display:flex}.detailBox{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:85vh;overflow:auto;padding:24px}.detailHeader{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.closeModal{border:0;background:#eef3f8;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.detailField{background:#f7f9fc;border-radius:10px;padding:12px}.detailField span{display:block;font-size:12px;color:#6b7c8f;font-weight:700}.detailField b{display:block;margin-top:4px}.modalActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.emptyState{padding:28px;text-align:center;color:#6b7c8f}.hidden{display:none!important}@media(max-width:800px){.calendarGrid{grid-template-columns:repeat(7,minmax(110px,1fr));overflow:auto}.calendarDay{min-height:108px}.agendaItem{grid-template-columns:1fr}.detailGrid{grid-template-columns:1fr}.calTopbar{align-items:stretch}.calNav,.calViews,.calFilters{width:100%}.calTitle{width:100%;text-align:center}.calSelect,.calBtn{flex:1}}
</style>
</head>
<body class="adminBody">
<main class="adminMain">
<section class="crmHero"><span class="crmBadge">PLANNING CENTRAL</span><h1>📅 Calendrier</h1><p>Soumissions, déménagements confirmés, employés, camions et échéances au même endroit.</p></section>
<section class="crmStats"><div class="crmStat"><b id="monthEvents">0</b><span>ÉVÉNEMENTS</span></div><div class="crmStat"><b id="monthSubs">0</b><span>SOUMISSIONS</span></div><div class="crmStat"><b id="monthTasks">0</b><span>MISSIONS</span></div><div class="crmStat"><b id="monthInvoices">0</b><span>ÉCHÉANCES</span></div></section>
<section class="crmPanel">
<div class="calTopbar">
<div class="calNav"><button id="prev" class="calBtn">←</button><button id="today" class="calBtn">Aujourd’hui</button><button id="next" class="calBtn">→</button></div>
<h2 id="periodTitle" class="calTitle"></h2>
<div class="calViews"><button class="calBtn viewBtn active" data-view="month">Mois</button><button class="calBtn viewBtn" data-view="week">Semaine</button><button class="calBtn viewBtn" data-view="day">Jour</button></div>
</div>
<div class="calFilters">
<select id="typeFilter" class="calSelect"><option value="all">Tous les types</option><option value="submission">Soumissions</option><option value="confirmed">Confirmés</option><option value="task">Missions</option><option value="invoice">Factures</option><option value="cancelled">Annulés</option></select>
<select id="employeeFilter" class="calSelect"><option value="all">Tous les employés</option></select>
<select id="truckFilter" class="calSelect"><option value="all">Tous les camions</option></select>
</div>
<div class="calendarLegend"><span><i class="legendDot dotSubmission"></i>Soumission</span><span><i class="legendDot dotConfirmed"></i>Confirmé</span><span><i class="legendDot dotTask"></i>Mission</span><span><i class="legendDot dotInvoice"></i>Facture</span><span><i class="legendDot dotCancelled"></i>Annulé</span></div>
<div id="monthView" class="calendarGrid"></div><div id="weekView" class="weekGrid hidden"></div><div id="dayView" class="dayList hidden"></div>
<h3 style="margin-top:25px">Agenda</h3><div id="agenda" class="agendaList"></div>
</section>
</main>
<div id="detailModal" class="detailModal"><div class="detailBox"><div class="detailHeader"><div><span id="modalType" class="crmBadge"></span><h2 id="modalTitle"></h2></div><button id="closeModal" class="closeModal">×</button></div><div id="modalDetails" class="detailGrid"></div><div class="modalActions"><a id="modalOpen" class="smallBtn" href="#">Ouvrir la fiche</a><a id="modalDispatch" class="smallBtn" href="dispatch.html">Voir le dispatch</a></div></div></div>
<script type="module">
import{auth,db}from'./firebase-config.js';
import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import{collection,getDocs}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
let cursor=new Date(),events=[],view='month';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(o,...ks)=>{for(const k of ks){const v=o?.[k];if(v!==undefined&&v!==null&&v!=='')return v}return''};
function parseDate(v){if(!v)return null;if(v?.toDate)return v.toDate();if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v))return new Date(v+'T12:00:00');const d=new Date(v);return isNaN(d)?null:d}
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const startOfWeek=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function filtered(){const t=$('typeFilter').value,e=$('employeeFilter').value,tr=$('truckFilter').value;return events.filter(x=>(t==='all'||x.kind===t)&&(e==='all'||x.employee===e)&&(tr==='all'||x.truck===tr))}
function classFor(e){return e.kind==='task'?'task':e.kind==='invoice'?'invoice':e.kind==='confirmed'?'confirmed':e.kind==='cancelled'?'cancelled':''}
function dateText(d){return new Intl.DateTimeFormat('fr-CA',{weekday:'short',day:'2-digit',month:'short'}).format(d)}
function timeText(e){return e.time||new Intl.DateTimeFormat('fr-CA',{hour:'2-digit',minute:'2-digit'}).format(e.date)}
function openDetails(e){$('modalType').textContent=e.kind==='submission'?'Soumission':e.kind==='confirmed'?'Déménagement confirmé':e.kind==='task'?'Mission':e.kind==='invoice'?'Facture':'Annulé';$('modalTitle').textContent=e.label;$('modalDetails').innerHTML=[['Date',dateText(e.date)],['Heure',timeText(e)],['Client',e.client],['Téléphone',e.phone],['Départ',e.depart],['Arrivée',e.arrival],['Employé',e.employee],['Camion',e.truck],['Statut',e.status],['Détails',e.detail]].filter(x=>x[1]).map(x=>`<div class="detailField"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('');$('modalOpen').href=e.href;$('modalDispatch').style.display=e.kind==='invoice'?'none':'inline-flex';$('detailModal').classList.add('open')}
window.__openCalEvent=i=>openDetails(filtered()[i]);
function drawMonth(list){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),today=dayKey(new Date());let html=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="calendarHead">${x}</div>`).join('');for(let i=0;i<42;i++){let day=i-start+1,dm=m,dy=y,muted=false;if(day<1){day=prevDays+day;dm=m-1;muted=true}if(day>days){day-=days;dm=m+1;muted=true}const dt=new Date(dy,dm,day),dk=dayKey(dt),es=list.filter(e=>dayKey(e.date)===dk);html+=`<div class="calendarDay${muted?' muted':''}${dk===today?' today':''}"><div class="calendarDate">${day}</div>${es.slice(0,5).map(e=>{const idx=list.indexOf(e);return`<a href="#" onclick="event.preventDefault();window.__openCalEvent(${idx})" class="calEvent ${classFor(e)}">${esc((e.time?e.time+' ':'')+e.icon+' '+e.label)}</a>`}).join('')}${es.length>5?`<div class="calEvent">+${es.length-5} autres</div>`:''}</div>`}$('monthView').innerHTML=html}
function drawWeek(list){const start=startOfWeek(cursor);let html='<div class="weekHead"></div>';for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+d);html+=`<div class="weekHead">${dateText(dt)}</div>`}for(let h=7;h<=21;h++){html+=`<div class="weekCell weekTime">${String(h).padStart(2,'0')}:00</div>`;for(let d=0;d<7;d++){const dt=new Date(start);dt.setDate(start.getDate()+d);const es=list.filter(e=>dayKey(e.date)===dayKey(dt)&&Number((e.time||'09:00').slice(0,2))===h);html+=`<div class="weekCell">${es.map(e=>{const idx=list.indexOf(e);return`<a href="#" onclick="event.preventDefault();window.__openCalEvent(${idx})" class="calEvent ${classFor(e)}">${esc(e.icon+' '+e.label)}</a>`}).join('')}</div>`}}$('weekView').innerHTML=html}
function drawDay(list){const es=list.filter(e=>dayKey(e.date)===dayKey(cursor)).sort((a,b)=>a.date-b.date);$('dayView').innerHTML=es.length?es.map(e=>{const idx=list.indexOf(e);return`<div class="dayCard ${classFor(e)}"><div class="agendaTime">${esc(timeText(e))}</div><h3>${esc(e.icon+' '+e.label)}</h3><div class="agendaMeta">${esc(e.detail||'')}</div><button class="smallBtn" onclick="window.__openCalEvent(${idx})">Détails</button></div>`}).join(''):'<div class="emptyState">Aucun événement ce jour.</div>'}
function drawAgenda(list){let range=list;if(view==='month')range=list.filter(e=>e.date.getFullYear()===cursor.getFullYear()&&e.date.getMonth()===cursor.getMonth());if(view==='week'){const s=startOfWeek(cursor),end=new Date(s);end.setDate(s.getDate()+7);range=list.filter(e=>e.date>=s&&e.date<end)}if(view==='day')range=list.filter(e=>dayKey(e.date)===dayKey(cursor));range.sort((a,b)=>a.date-b.date);$('agenda').innerHTML=range.length?range.map(e=>{const idx=list.indexOf(e);return`<div class="agendaItem"><div class="agendaTime">${esc(dateText(e.date))}<br>${esc(timeText(e))}</div><div><strong>${esc(e.icon+' '+e.label)}</strong><div class="agendaMeta">${esc(e.detail||'')}</div></div><button class="smallBtn" onclick="window.__openCalEvent(${idx})">Détails</button></div>`}).join(''):'<div class="emptyState">Aucun événement pour cette période.</div>'}
function draw(){const list=filtered();document.querySelectorAll('.viewBtn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('monthView').classList.toggle('hidden',view!=='month');$('weekView').classList.toggle('hidden',view!=='week');$('dayView').classList.toggle('hidden',view!=='day');if(view==='month')$('periodTitle').textContent=new Intl.DateTimeFormat('fr-CA',{month:'long',year:'numeric'}).format(cursor);if(view==='week'){const s=startOfWeek(cursor),e=new Date(s);e.setDate(s.getDate()+6);$('periodTitle').textContent=`${dateText(s)} – ${dateText(e)}`}if(view==='day')$('periodTitle').textContent=new Intl.DateTimeFormat('fr-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(cursor);const active=view==='month'?list.filter(e=>e.date.getMonth()===cursor.getMonth()&&e.date.getFullYear()===cursor.getFullYear()):list;$('monthEvents').textContent=active.length;$('monthSubs').textContent=active.filter(e=>e.kind==='submission'||e.kind==='confirmed').length;$('monthTasks').textContent=active.filter(e=>e.kind==='task').length;$('monthInvoices').textContent=active.filter(e=>e.kind==='invoice').length;drawMonth(list);drawWeek(list);drawDay(list);drawAgenda(list)}
$('prev').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);else if(view==='week')cursor.setDate(cursor.getDate()-7);else cursor.setDate(cursor.getDate()-1);cursor=new Date(cursor);draw()};$('next').onclick=()=>{if(view==='month')cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);else if(view==='week')cursor.setDate(cursor.getDate()+7);else cursor.setDate(cursor.getDate()+1);cursor=new Date(cursor);draw()};$('today').onclick=()=>{cursor=new Date();draw()};document.querySelectorAll('.viewBtn').forEach(b=>b.onclick=()=>{view=b.dataset.view;draw()});['typeFilter','employeeFilter','truckFilter'].forEach(id=>$(id).onchange=draw);$('closeModal').onclick=()=>$('detailModal').classList.remove('open');$('detailModal').onclick=e=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('open')};
onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}try{const names=['demandes_soumission','taches','factures'];const [q,t,f]=await Promise.all(names.map(n=>getDocs(collection(db,n))));q.forEach(d=>{const o=d.data(),date=parseDate(val(o,'date','dateSouhaitee','dateDemenagement'));if(!date)return;const status=String(val(o,'statut','status')).toLowerCase(),kind=status.includes('accept')||status.includes('confirm')?'confirmed':status.includes('annul')||status.includes('refus')?'cancelled':'submission';const time=val(o,'heure','heureDemenagement','time');if(time)date.setHours(Number(String(time).slice(0,2))||9,Number(String(time).slice(3,5))||0);events.push({date,time,kind,icon:kind==='confirmed'?'✅':kind==='cancelled'?'⛔':'📋',label:(val(o,'nom','name')||'Client')+' — '+(val(o,'service','typeService')||'Soumission'),client:val(o,'nom','name'),phone:val(o,'telephone','phone'),depart:val(o,'adresseDepart','depart'),arrival:val(o,'destination','adresseArrivee'),employee:val(o,'employeeName','employeNom','employe'),truck:val(o,'truck','camion','vehicule'),status:val(o,'statut','status'),detail:(val(o,'adresseDepart','depart')||'')+' → '+(val(o,'destination','adresseArrivee')||''),href:'soumissions.html'})});t.forEach(d=>{const o=d.data(),date=parseDate(val(o,'date','dateTravail','scheduledDate'));if(!date)return;const time=val(o,'heureDebut','heure','startTime');if(time)date.setHours(Number(String(time).slice(0,2))||9,Number(String(time).slice(3,5))||0);events.push({date,time,kind:'task',icon:'👷',label:(val(o,'clientNom','nom')||'Mission')+' — '+(val(o,'service','typeService')||''),client:val(o,'clientNom','nom'),phone:val(o,'telephone','phone'),depart:val(o,'adresseDepart','depart','adresse'),arrival:val(o,'adresseArrivee','destination'),employee:val(o,'employeeName','employeNom','employe'),truck:val(o,'truck','camion','vehicule'),status:val(o,'statut','status'),detail:[val(o,'employeeName','employeNom'),val(o,'truck','camion','vehicule')].filter(Boolean).join(' • '),href:'dispatch.html'})});f.forEach(d=>{const o=d.data(),date=parseDate(val(o,'dateEcheance','echeance','date'));if(!date)return;events.push({date,time:'09:00',kind:'invoice',icon:'🧾',label:val(o,'numero','numeroFacture')||'Facture',client:val(o,'clientNom','nom'),status:val(o,'statut','status'),detail:(val(o,'clientNom','nom')||'Client')+' — '+Number(o.total||o.totalTTC||0).toLocaleString('fr-CA',{style:'currency',currency:'CAD'}),href:'facturation.html'})});const employees=[...new Set(events.map(e=>e.employee).filter(Boolean))].sort(),trucks=[...new Set(events.map(e=>e.truck).filter(Boolean))].sort();employees.forEach(x=>$('employeeFilter').insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(x)}</option>`));trucks.forEach(x=>$('truckFilter').insertAdjacentHTML('beforeend',`<option value="${esc(x)}">${esc(x)}</option>`));draw()}catch(e){$('monthView').innerHTML=`<div class="emptyState">Erreur : ${esc(e.message)}</div>`}});
</script>
<script src="admin-nav.js?v=onesignal-clean-20260719-1"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="push.js?v=onesignal-clean-20260719-1" defer></script>
</body></html>
