<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendrier | Moventra</title><link rel="icon" href="logo.jpeg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-nav.css?v=crm-menu-1"></head><body class="adminBody"><main class="adminMain"><section class="adminHero"><span class="adminBadge">Planning</span><h1>Calendrier</h1><p>Soumissions planifiées, travaux et échéances des factures.</p></section><section class="panel"><div class="calControls"><button id="prev">←</button><h2 id="month"></h2><button id="next">→</button></div><div id="calendar" class="calendarGrid"></div></section></main>
<script type="module">
import {auth,db} from './firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
let cursor=new Date(),events=[];const cal=document.getElementById('calendar'),title=document.getElementById('month');const val=(o,...ks)=>{for(const k of ks)if(o?.[k])return o[k];return''};function parseDate(v){if(!v)return null;if(v?.toDate)return v.toDate();const d=new Date(v);return isNaN(d)?null:d}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){const y=cursor.getFullYear(),m=cursor.getMonth();title.textContent=new Intl.DateTimeFormat('fr-CA',{month:'long',year:'numeric'}).format(cursor);const first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();let html=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="calendarHead">${x}</div>`).join('');for(let i=0;i<42;i++){let day=i-start+1,dm=m,dy=y,muted=false;if(day<1){day=prevDays+day;dm=m-1;muted=true}if(day>days){day-=days;dm=m+1;muted=true}const dt=new Date(dy,dm,day),key=dt.toISOString().slice(0,10);const es=events.filter(e=>e.key===key);html+=`<div class="calendarDay${muted?' muted':''}"><div class="calendarDate">${day}</div>${es.map(e=>`<a href="${e.href}" class="calEvent ${e.type}">${esc(e.label)}</a>`).join('')}</div>`}cal.innerHTML=html}
document.getElementById('prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);draw()};document.getElementById('next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);draw()};
onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}try{const [q,t,f]=await Promise.all([getDocs(collection(db,'demandes_soumission')),getDocs(collection(db,'taches')),getDocs(collection(db,'factures'))]);q.forEach(d=>{const o=d.data(),date=parseDate(val(o,'date','dateSouhaitee','dateDemenagement'));if(date)events.push({key:date.toISOString().slice(0,10),label:'📋 '+(val(o,'nom','name')||'Soumission')+' — '+(val(o,'service','typeService')||'Service'),href:'admin.html#soumissions',type:''})});t.forEach(d=>{const o=d.data(),date=parseDate(val(o,'date','dateTravail','scheduledDate'));if(date)events.push({key:date.toISOString().slice(0,10),label:'👷 '+(val(o,'clientNom','nom')||'Travail'),href:'dispatch.html',type:'task'})});f.forEach(d=>{const o=d.data(),date=parseDate(val(o,'dateEcheance','echeance'));if(date)events.push({key:date.toISOString().slice(0,10),label:'🧾 '+(val(o,'numero','numeroFacture')||'Facture'),href:'facturation.html',type:''})});draw()}catch(e){cal.innerHTML=`<div class="emptyState">Erreur: ${esc(e.message)}</div>`}});
</script><script src="admin-nav.js?v=crm-menu-1"></script></body></html>
