<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réinitialiser Moventra</title></head><body><button id="b">Nettoyer le cache</button><p id="o"></p><script>document.getElementById("b").onclick=async()=>{const o=document.getElementById("o");try{o.textContent="Nettoyage…";if("caches" in window)for(const k of await caches.keys())await caches.delete(k);if("serviceWorker" in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();sessionStorage.clear();o.textContent="Terminé. Supprime l’ancienne icône puis réinstalle Moventra.";setTimeout(()=>location.href="https://www.moventratransport.ca/login.html?fresh="+Date.now(),1500)}catch(e){o.textContent=e.message}}</script></body></html>
