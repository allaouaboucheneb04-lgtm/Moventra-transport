<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b46b5">
  <title>Redirection Moventra</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#eef6ff;color:#0b2447;text-align:center;padding:24px}
    .card{max-width:460px;background:#fff;border-radius:24px;padding:34px;box-shadow:0 18px 50px rgba(11,70,181,.12)}
    img{width:84px;height:84px;object-fit:cover;border-radius:18px}.loader{width:34px;height:34px;border:4px solid #dbeafe;border-top-color:#0b6fe8;border-radius:50%;animation:s .8s linear infinite;margin:22px auto}
    @keyframes s{to{transform:rotate(360deg)}}
    a{color:#0b6fe8;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img src="./logo.jpeg" alt="Moventra">
    <h1>Ouverture de Moventra…</h1>
    <div class="loader"></div>
    <p>L’ancien raccourci de l’application pointe vers une adresse qui n’existe plus. Redirection automatique vers la connexion.</p>
    <p><a id="manual" href="./login.html">Ouvrir Moventra Admin</a></p>
  </main>
  <script>
    (function(){
      var path = location.pathname.toLowerCase();
      var isAdmin = /admin|login|dispatch|clients|factur|devis|soumission|calendrier|employe|promotion|parametre|historique|cloture/.test(path);
      var target = isAdmin ? './login.html?source=recovery&v=pwa-404-fix-1' : './index.html?v=pwa-404-fix-1';
      document.getElementById('manual').href = target;
      setTimeout(function(){ location.replace(target); }, 700);
    })();
  </script>
</body>
</html>
