<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clôture mission | Moventra</title><link rel="stylesheet" href="workflow.css"></head><body><main class="shell"><header class="top"><h1>🚚 Clôture du déménagement</h1><a class="btn secondary" href="dispatch.html">← Dispatch</a></header><section class="card"><div class="formGrid"><label>Heure réelle début<input id="debut" type="datetime-local"></label><label>Heure réelle fin<input id="fin" type="datetime-local"></label><label>Mode de paiement<select id="paiement"><option>Non payé</option><option>Espèces</option><option>Débit</option><option>Crédit</option><option>Virement</option><option>Chèque</option></select></label><label>Acompte reçu<input id="acompte" type="number" step=".01"></label><label class="full">Commentaires<textarea id="commentaires"></textarea></label></div><h2>Suppléments</h2><table class="lines"><thead><tr><th>Description</th><th>Qté</th><th>Prix</th><th></th></tr></thead><tbody id="sup"></tbody></table><button class="btn secondary" id="add">＋ Ajouter supplément</button><div class="actions"><button class="btn green" id="close">✅ Clôturer la mission</button></div><div id="msg" class="notice"></div></section></main><script type="module" src="cloture.js?v=workflow-final-1"></script></body></html>
