<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test webhook Moventra</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><section class="card"><h1>Test du webhook Moventra</h1><p>Cette page envoie une notification test à Make sans créer de soumission.</p><button id="testBtn" class="btn">Envoyer un test</button><p id="result"></p><p><a href="index.html">Retour au site</a></p></section></main><script src="webhook-config.js"></script><script>
const btn=document.getElementById('testBtn'),out=document.getElementById('result');
btn.onclick=async()=>{const url=String(window.MOVENTRA_WEBHOOK_URL||'').trim();if(!url){out.className='error';out.textContent='Ajoute d’abord l’URL Make dans webhook-config.js.';return;}btn.disabled=true;out.textContent='Test en cours...';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:'test_notification_moventra',submissionId:'TEST-'+Date.now(),createdAt:new Date().toISOString(),nom:'Test Moventra',telephone:'438-229-9722',service:'Test notification',depart:'Montréal',destination:'Montréal',details:'Test du webhook Make vers OneSignal'})});if(!r.ok)throw new Error('HTTP '+r.status);out.className='success';out.textContent='Test envoyé à Make.';}catch(e){out.className='error';out.textContent='Erreur : '+e.message;}finally{btn.disabled=false;}};
</script></body></html>
