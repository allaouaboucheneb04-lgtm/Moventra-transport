<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients | Moventra</title><link rel="icon" href="logo.jpeg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-nav.css?v=crm-menu-1"></head><body class="adminBody">
<main class="adminMain"><section class="adminHero"><span class="adminBadge">CRM</span><h1>Clients</h1><p>Une fiche par client, avec toutes ses soumissions et factures.</p></section><section class="panel"><input id="search" class="searchBox" placeholder="Rechercher par nom, téléphone, courriel ou adresse…"><div id="summary" class="adminStatus"></div><div id="clients" class="clientGrid"><div class="emptyState">Chargement des clients…</div></div></section></main>
<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { collection,getDocs } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const list=document.getElementById('clients'),search=document.getElementById('search'),summary=document.getElementById('summary');let clients=[];
const val=(o,...k)=>{for(const x of k)if(o?.[x]!==undefined&&o[x]!==null&&String(o[x]).trim())return String(o[x]).trim();return''};
const keyOf=o=>(val(o,'email','courriel').toLowerCase()||val(o,'telephone','phone','tel').replace(/\D/g,'')||val(o,'nom','name').toLowerCase()+'|'+val(o,'adresseDepart','depart','adresse').toLowerCase());
function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=search.value.trim().toLowerCase();const rows=clients.filter(c=>c.search.includes(q));summary.textContent=`${rows.length} client${rows.length>1?'s':''} trouvé${rows.length>1?'s':''}`;list.innerHTML=rows.length?rows.map(c=>`<article class="clientCard"><h3>${esc(c.nom||'Client sans nom')}</h3><div class="clientMeta">📞 ${esc(c.tel||'—')}<br>✉️ ${esc(c.email||'—')}<br>📍 ${esc(c.adresse||'—')}</div><div class="clientStats"><span>📋 ${c.submissions.length} soumission${c.submissions.length>1?'s':''}</span><span>🧾 ${c.invoices.length} facture${c.invoices.length>1?'s':''}</span><span>💰 ${c.total.toFixed(2)} $</span></div><div class="clientActions"><a href="facturation.html?client=${encodeURIComponent(c.key)}">Créer facture</a><button class="secondary" onclick="alert('${esc(c.submissions.slice(0,8).map(s=>(val(s,'service','typeService')||'Service')+' — '+(val(s,'date','dateSouhaitee')||'Date inconnue')).join('\\n')).replace(/'/g,'\\\'')}')">Voir historique</button></div></article>`).join(''):'<div class="emptyState">Aucun client trouvé.</div>'}
search.addEventListener('input',render);
onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html';return}try{const [qs,fs]=await Promise.all([getDocs(collection(db,'demandes_soumission')),getDocs(collection(db,'factures'))]);const map=new Map();const ensure=o=>{const k=keyOf(o);if(!k)return null;if(!map.has(k))map.set(k,{key:k,nom:val(o,'nom','name','clientNom'),tel:val(o,'telephone','phone','tel','clientTelephone'),email:val(o,'email','courriel','clientEmail'),adresse:val(o,'adresseDepart','depart','adresse','clientAdresse'),submissions:[],invoices:[],total:0});const c=map.get(k);c.nom=c.nom||val(o,'nom','name','clientNom');c.tel=c.tel||val(o,'telephone','phone','tel','clientTelephone');c.email=c.email||val(o,'email','courriel','clientEmail');c.adresse=c.adresse||val(o,'adresseDepart','depart','adresse','clientAdresse');return c};qs.forEach(d=>{const o={id:d.id,...d.data()},c=ensure(o);if(c)c.submissions.push(o)});fs.forEach(d=>{const o={id:d.id,...d.data()},c=ensure(o);if(c){c.invoices.push(o);c.total+=Number(o.total||o.totalTTC||0)}});clients=[...map.values()].map(c=>({...c,search:[c.nom,c.tel,c.email,c.adresse].join(' ').toLowerCase()})).sort((a,b)=>a.nom.localeCompare(b.nom));render()}catch(e){list.innerHTML=`<div class="emptyState">Erreur: ${esc(e.message)}</div>`}});
</script><script src="admin-nav.js?v=crm-menu-1"></script></body></html>
