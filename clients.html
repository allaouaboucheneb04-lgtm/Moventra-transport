<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clients | Moventra</title><link rel="icon" href="logo.jpeg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="admin-nav.css?v=crm-real-2"></head><body class="adminBody">
<main class="adminMain"><section class="crmHero"><span class="crmBadge">CRM CLIENTS</span><h1>👥 Clients</h1><p>Une seule fiche par client, même s’il a plusieurs soumissions et plusieurs factures.</p></section>
<section class="crmStats"><div class="crmStat"><b id="statClients">0</b><span>CLIENTS UNIQUES</span></div><div class="crmStat"><b id="statSoumissions">0</b><span>SOUMISSIONS</span></div><div class="crmStat"><b id="statFactures">0</b><span>FACTURES</span></div><div class="crmStat"><b id="statCA">0 $</b><span>MONTANT FACTURÉ</span></div></section>
<section class="crmPanel"><div class="crmToolbar"><input id="search" class="crmSearch" placeholder="Rechercher par nom, téléphone, courriel ou adresse…"><select id="sort" class="crmSelect"><option value="name">Trier par nom</option><option value="recent">Plus récents</option><option value="revenue">Montant facturé</option><option value="submissions">Nombre de soumissions</option></select><button id="manualInvoice" class="smallBtn">+ Nouvelle facture manuelle</button></div><div id="summary" class="adminStatus"></div><div id="clients" class="clientGrid"><div class="emptyState">Chargement des clients…</div></div></section></main>
<div id="clientModal" class="crmModal"><section class="crmModalCard"><div class="crmModalHead"><div><span class="crmBadge" style="background:#eaf3ff;color:#0b66d8">FICHE CLIENT</span><h2 id="modalName" style="margin:9px 0 3px"></h2><div id="modalContact" class="clientMeta"></div></div><button id="modalClose" class="crmClose">×</button></div><div id="modalStats" class="clientStats"></div><div class="crmTabs"><button class="crmTab active" data-tab="submissions">Soumissions</button><button class="crmTab" data-tab="invoices">Factures</button></div><div id="modalContent"></div><div class="clientActions" style="margin-top:18px"><a id="modalInvoice" href="facturation.html">Créer une facture</a><button id="modalClose2" class="secondary">Fermer</button></div></section></div>
<script type="module">
import {auth,db} from './firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{collection,getDocs}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const $=id=>document.getElementById(id),list=$('clients'),search=$('search'),sort=$('sort'),summary=$('summary'),modal=$('clientModal');let clients=[],selected=null,currentTab='submissions';
const val=(o,...ks)=>{for(const k of ks){const v=o?.[k];if(v!==undefined&&v!==null&&String(v).trim())return String(v).trim()}return''};const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase();const phone=s=>String(s||'').replace(/\D/g,'');const keyOf=o=>norm(val(o,'email','courriel','clientEmail'))||phone(val(o,'telephone','phone','tel','clientTelephone'))||`${norm(val(o,'nom','name','clientNom'))}|${norm(val(o,'adresseDepart','depart','adresse','clientAdresse'))}`;
const asDate=v=>{try{if(v?.toDate)return v.toDate();const d=new Date(v);return isNaN(d)?null:d}catch{return null}};const fmt=v=>{const d=asDate(v);return d?new Intl.DateTimeFormat('fr-CA',{dateStyle:'medium'}).format(d):'Date inconnue'};
function renderStats(){const subs=clients.reduce((n,c)=>n+c.submissions.length,0),invs=clients.reduce((n,c)=>n+c.invoices.length,0),ca=clients.reduce((n,c)=>n+c.total,0);$('statClients').textContent=clients.length;$('statSoumissions').textContent=subs;$('statFactures').textContent=invs;$('statCA').textContent=ca.toLocaleString('fr-CA',{style:'currency',currency:'CAD'})}
function sortedRows(rows){return [...rows].sort((a,b)=>sort.value==='recent'?b.last-a.last:sort.value==='revenue'?b.total-a.total:sort.value==='submissions'?b.submissions.length-a.submissions.length:a.nom.localeCompare(b.nom,'fr'))}
function render(){const q=norm(search.value);const rows=sortedRows(clients.filter(c=>c.search.includes(q)));summary.textContent=`${rows.length} client${rows.length>1?'s':''} affiché${rows.length>1?'s':''}`;list.innerHTML=rows.length?rows.map(c=>`<article class="clientCard"><h3>${esc(c.nom||'Client sans nom')}</h3><div class="clientMeta">📞 ${esc(c.tel||'—')}<br>✉️ ${esc(c.email||'—')}<br>📍 ${esc(c.adresse||'—')}</div><div class="clientStats"><span>📋 ${c.submissions.length}</span><span>🧾 ${c.invoices.length}</span><span>💰 ${c.total.toLocaleString('fr-CA',{style:'currency',currency:'CAD'})}</span></div><div class="clientActions"><button data-key="${encodeURIComponent(c.key)}">Ouvrir la fiche</button><a href="facturation.html?client=${encodeURIComponent(c.key)}">Créer facture</a></div></article>`).join(''):'<div class="emptyState">Aucun client trouvé.</div>';list.querySelectorAll('button[data-key]').forEach(b=>b.onclick=()=>openClient(decodeURIComponent(b.dataset.key)))}
function renderModal(){if(!selected)return;$('modalName').textContent=selected.nom||'Client sans nom';$('modalContact').innerHTML=`📞 ${esc(selected.tel||'—')} &nbsp; • &nbsp; ✉️ ${esc(selected.email||'—')}<br>📍 ${esc(selected.adresse||'—')}`;$('modalStats').innerHTML=`<span>📋 ${selected.submissions.length} soumission(s)</span><span>🧾 ${selected.invoices.length} facture(s)</span><span>💰 ${selected.total.toLocaleString('fr-CA',{style:'currency',currency:'CAD'})}</span>`;$('modalInvoice').href=`facturation.html?client=${encodeURIComponent(selected.key)}`;document.querySelectorAll('.crmTab').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentTab));const rows=currentTab==='submissions'?selected.submissions:selected.invoices;$('modalContent').innerHTML=rows.length?rows.sort((a,b)=>(b._date||0)-(a._date||0)).map(o=>currentTab==='submissions'?`<article class="historyItem"><h4>${esc(val(o,'service','typeService')||'Soumission')}</h4><div class="historyMeta">📅 ${fmt(val(o,'date','dateSouhaitee','dateDemenagement','createdAt'))}<br>📍 ${esc(val(o,'adresseDepart','depart')||'—')} → ${esc(val(o,'destination','adresseArrivee')||'—')}<br>${esc(val(o,'details','message')||'')}</div><div class="clientActions" style="margin-top:10px"><a href="facturation.html?soumission=${encodeURIComponent(o.id)}">Facturer cette soumission</a></div></article>`:`<article class="historyItem"><h4>${esc(val(o,'numero','numeroFacture')||o.id)}</h4><div class="historyMeta">📅 ${fmt(val(o,'date','createdAt'))}<br>Statut : ${esc(val(o,'statut','status')||'—')}<br>Total : ${Number(o.total||o.totalTTC||0).toLocaleString('fr-CA',{style:'currency',currency:'CAD'})}</div></article>`).join(''):'<div class="emptyState">Aucun élément dans cet historique.</div>'}
function openClient(k){selected=clients.find(c=>c.key===k);currentTab='submissions';renderModal();modal.classList.add('open');document.body.style.overflow='hidden'}function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}
search.oninput=render;sort.onchange=render;$('manualInvoice').onclick=()=>location.href='facturation.html?manual=1';$('modalClose').onclick=$('modalClose2').onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.querySelectorAll('.crmTab').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;renderModal()});
onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html';return}try{const [qs,fs]=await Promise.all([getDocs(collection(db,'demandes_soumission')),getDocs(collection(db,'factures'))]);const map=new Map();const ensure=o=>{const k=keyOf(o);if(!k)return null;if(!map.has(k))map.set(k,{key:k,nom:val(o,'nom','name','clientNom'),tel:val(o,'telephone','phone','tel','clientTelephone'),email:val(o,'email','courriel','clientEmail'),adresse:val(o,'adresseDepart','depart','adresse','clientAdresse'),submissions:[],invoices:[],total:0,last:0});const c=map.get(k);c.nom=c.nom||val(o,'nom','name','clientNom');c.tel=c.tel||val(o,'telephone','phone','tel','clientTelephone');c.email=c.email||val(o,'email','courriel','clientEmail');c.adresse=c.adresse||val(o,'adresseDepart','depart','adresse','clientAdresse');return c};qs.forEach(d=>{const o={id:d.id,...d.data()},c=ensure(o),dt=asDate(val(o,'date','dateSouhaitee','dateDemenagement','createdAt'));o._date=dt?.getTime()||0;if(c){c.submissions.push(o);c.last=Math.max(c.last,o._date)}});fs.forEach(d=>{const o={id:d.id,...d.data()},c=ensure(o),dt=asDate(val(o,'date','createdAt'));o._date=dt?.getTime()||0;if(c){c.invoices.push(o);c.total+=Number(o.total||o.totalTTC||0);c.last=Math.max(c.last,o._date)}});clients=[...map.values()].map(c=>({...c,search:norm([c.nom,c.tel,c.email,c.adresse].join(' '))}));renderStats();render()}catch(e){list.innerHTML=`<div class="emptyState">Erreur : ${esc(e.message)}</div>`}});
</script><script src="admin-nav.js?v=crm-real-2"></script></body></html>
