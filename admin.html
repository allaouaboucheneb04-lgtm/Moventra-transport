<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Moventra</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="admin-manifest.json"></head><body><header class="top"><a class="brand"><img src="logo.jpeg"><span>ADMIN MOVENTRA</span></a><nav class="nav"><button class="btn secondary" onclick="loadAll()">Rafraîchir</button><button class="btn" onclick="enableMoventraNotifications()">🔔 Notifications</button><button class="btn danger" onclick="logout()">Déconnexion</button></nav><button class="btn menuBtn" id="menuBtn">☰</button></header><div class="drawer" id="drawer"><button class="btn secondary" onclick="loadAll()">Rafraîchir</button><button class="btn" onclick="enableMoventraNotifications()">🔔 Notifications</button><button class="btn danger" onclick="logout()">Déconnexion</button></div><main class="wrap"><section class="hero"><h1>Gestion Moventra</h1><p>Soumissions, travaux et employés dans la nouvelle base Firebase Moventra.</p></section><section class="grid"><div class="card"><div id="qCount" class="stat">0</div><b>Soumissions</b></div><div class="card"><div id="wCount" class="stat">0</div><b>Travaux</b></div><div class="card"><div id="eCount" class="stat">0</div><b>Employés</b></div></section><section class="card" style="margin-top:22px"><h2>Demandes reçues</h2><div id="quotes" class="list"><p>Chargement...</p></div></section><section class="card" style="margin-top:22px"><h2>Créer un travail</h2><form id="workForm"><div class="formgrid"><div><label>Titre</label><input name="titre" required></div><div><label>Employé (UID ou courriel)</label><input name="employe"></div><div><label>Date</label><input name="date" type="date"></div><div><label>Adresse</label><input name="adresse"></div></div><label>Détails</label><textarea name="details"></textarea><button class="btn">Créer</button><p id="workMsg"></p></form></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script><script src="firebase-config.js"></script><script src="common.js"></script><script src="onesignal.js"></script><script src="admin.js"></script></body></html>
